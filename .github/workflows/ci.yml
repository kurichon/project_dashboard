name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and unit tests
        run: |
          node --check extension/newtab.js
          node --check extension/pulse-core.js
          node --check extension/background.js
          node --test tests/*.test.cjs
      - name: Store and developer package verification
        run: |
          python tools/package-release.py --out dist
          python -m unittest discover -s tests -p 'test_package_release.py'
      - name: Mocked browser UI smoke
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser-store-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: project-dashboard-v1.4-candidates
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy in-place upgrade smoke (development only)
        shell: pwsh
        run: ./tests/upgrade-local.Tests.ps1